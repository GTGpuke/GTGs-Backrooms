name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release a publier, par exemple v0.9.0."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verification complete et publication
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre le wrapper executable
        run: chmod +x ./gradlew

      - name: Ecran virtuel et rendu logiciel pour le client de test (Xvfb, Mesa llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Resoudre le tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extraire la version du tag
        id: version
        run: echo "VERSION=${{ steps.tag.outputs.name }}" | sed 's/^VERSION=v/VERSION=/' >> "$GITHUB_OUTPUT"

      - name: Verification complete (Checkstyle, tests, tests en jeu serveur et client, couverture, contenu du JAR) et build
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew clean build --no-daemon --console=plain --warning-mode all
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Verifier la version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          GRADLE_VERSION=$(grep '^mod_version=' gradle.properties | cut -d '=' -f 2)
          if [ "$VERSION" != "$GRADLE_VERSION" ]; then
            echo "Le tag v$VERSION ne correspond pas a mod_version=$GRADLE_VERSION."
            exit 1
          fi
          test -f "build/libs/gtgs_backrooms-${VERSION}.jar"
          test -f "build/libs/gtgs_backrooms-${VERSION}-sources.jar"

      - name: Extraire les notes de version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" docs/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Voir docs/CHANGELOG.md."
          fi
          echo "$NOTES" > release_notes.md

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "GTG's Backrooms v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          files: |
            build/libs/gtgs_backrooms-${{ steps.version.outputs.VERSION }}.jar
            build/libs/gtgs_backrooms-${{ steps.version.outputs.VERSION }}-sources.jar
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
